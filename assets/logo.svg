<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <linearGradient id="matlabGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="dspGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#e11d48" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Deep Obsidian Container -->
  <rect width="160" height="160" rx="36" fill="#0c0a14" />
  <rect x="2" y="2" width="156" height="156" rx="34" fill="none" stroke="#e11d48" stroke-opacity="0.22" stroke-width="2" />

  <!-- DSP Discrete Stem Waveform + LaTeX Mathematical Document Integral Frame -->
  <g filter="url(#dspGlow)">
    <!-- Mathematical Document Page Frame -->
    <rect x="36" y="32" width="88" height="96" rx="10" fill="none" stroke="url(#matlabGrad)" stroke-width="3" stroke-dasharray="8 4" opacity="0.75" />
    
    <!-- Discrete Time Signal Stems (MATLAB stem plot representation) -->
    <!-- Stem 1 -->
    <line x1="52" y1="80" x2="52" y2="60" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="52" cy="60" r="3.5" fill="#38bdf8" />

    <!-- Stem 2 (Peak) -->
    <line x1="66" y1="80" x2="66" y2="44" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
    <circle cx="66" cy="44" r="4.5" fill="#e11d48" />

    <!-- Stem 3 -->
    <line x1="80" y1="80" x2="80" y2="66" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="80" cy="66" r="3.5" fill="#38bdf8" />

    <!-- Stem 4 (Trough) -->
    <line x1="94" y1="80" x2="94" y2="104" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
    <circle cx="94" cy="104" r="4" fill="#e11d48" />

    <!-- Stem 5 -->
    <line x1="108" y1="80" x2="108" y2="74" stroke="#0284c7" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="108" cy="74" r="3.5" fill="#38bdf8" />

    <!-- Zero Amplitude Time Axis -->
    <line x1="44" y1="80" x2="116" y2="80" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
  </g>
</svg>
