[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matlab-labsheet-maker"
version = "1.0.0"
description = "Automated LaTeX labsheet and assignment generator from MATLAB scripts and figures"
readme = "README.md"
requires-python = ">=3.9"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
